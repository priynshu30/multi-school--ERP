version: '3.8'

services:
  # ==========================================
  # DATABASE: MongoDB 7.0
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: multi-school-erp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: multi-school-erp
    volumes:
      - mongo_data:/data/db
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # CACHE & REALTIME: Redis 7
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: multi-school-erp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # BACKEND API: Node.js + Express
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: multi-school-erp-server
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/multi-school-erp}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in .env}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp-network

  # ==========================================
  # FRONTEND: React + Vite + Nginx
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: multi-school-erp-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  erp-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
